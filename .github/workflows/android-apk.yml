name: Build Android APK

on:
  push:
    branches: [connect-new-supabase, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: npm run build
        env:
          # Lets the installed app know its own version so it can offer updates.
          VITE_BUILD_NUMBER: ${{ github.run_number }}

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleMusicRelease --no-daemon --stacktrace \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }} 2>&1 | tee gradle.log || {
              grep -E -A12 "What went wrong|error:|FAILURE|Exception" gradle.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            }

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/music/release/app-music-release.apk out/SommyartMusic.apk
          cp out/SommyartMusic.apk "out/SommyartMusic-1.0.${{ github.run_number }}.apk"
          ls -lh out

      - name: Keep a copy on the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: SommyartMusic-1.0.${{ github.run_number }}
          path: out/SommyartMusic.apk

      - name: Write release notes
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          NOTE=$(printf '%s' "$COMMIT_MSG" | head -n1 | tr -d '\r' | cut -c1-140)
          [ -z "$NOTE" ] && NOTE="Improvements and fixes"
          {
            echo "Latest Android build of Sommyart Music, version 1.0.${{ github.run_number }}."
            echo
            echo "What's new: $NOTE"
            echo
            echo 'Download **SommyartMusic.apk** below on your Android phone, open it, and allow'
            echo '"Install unknown apps" for your browser if Android asks.'
          } > out/release-notes.md
          jq -n --argjson build ${{ github.run_number }} --arg notes "$NOTE" '{build: $build, notes: $notes}' > out/latest.json
          cat out/release-notes.md out/latest.json

      - name: Publish to the "latest" download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Sommyart Music for Android (latest)
          prerelease: false
          make_latest: true
          body_path: out/release-notes.md
          files: |
            out/SommyartMusic.apk
            out/SommyartMusic-1.0.${{ github.run_number }}.apk
            out/latest.json

      # ---------- Sommyart Studio (the upload app) ----------
      # Built from the same code with VITE_APP=studio, as its own app (com.sommyart.studio),
      # so it installs next to the listener app. Songs can be shared to it from a file manager.

      - name: Build Studio web app
        run: npm run build
        env:
          VITE_APP: studio
          VITE_BUILD_NUMBER: ${{ github.run_number }}

      - name: Copy Studio into Android project
        run: |
          # The songs bundled for offline listening are not needed in the upload app.
          rm -rf dist/music
          npx cap copy android

      - name: Build signed Studio APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleStudioRelease --no-daemon --stacktrace \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }} 2>&1 | tee gradle-studio.log || {
              grep -E -A12 "What went wrong|error:|FAILURE|Exception" gradle-studio.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            }

      - name: Name the Studio APK
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          NOTE=$(printf '%s' "$COMMIT_MSG" | head -n1 | tr -d '\r' | cut -c1-140)
          [ -z "$NOTE" ] && NOTE="Improvements and fixes"
          mkdir -p studio-out
          cp android/app/build/outputs/apk/studio/release/app-studio-release.apk studio-out/SommyartStudio.apk
          cp studio-out/SommyartStudio.apk "studio-out/SommyartStudio-1.0.${{ github.run_number }}.apk"
          {
            echo "Latest Android build of Sommyart Studio (uploads), version 1.0.${{ github.run_number }}."
            echo
            echo "What's new: $NOTE"
            echo
            echo 'Download **SommyartStudio.apk** below on your Android phone and open it. It installs'
            echo 'next to Sommyart Music. To upload a song, share it from your file manager to Sommyart Studio.'
          } > studio-out/release-notes.md
          jq -n --argjson build ${{ github.run_number }} --arg notes "$NOTE" '{build: $build, notes: $notes}' > studio-out/latest.json
          ls -lh studio-out

      - name: Publish Studio to its own download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-latest
          name: Sommyart Studio for Android (latest)
          prerelease: false
          make_latest: false
          body_path: studio-out/release-notes.md
          files: |
            studio-out/SommyartStudio.apk
            studio-out/SommyartStudio-1.0.${{ github.run_number }}.apk
            studio-out/latest.json
