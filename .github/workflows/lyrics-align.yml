name: Align lyrics

# Works out when each line of an artist's pasted lyrics is sung. Started by the app when an artist taps
# "Generate timing" (needs the GH_DISPATCH_TOKEN secret in Supabase), and once a day as a safety net.
# This file must live on the default branch (main) for GitHub to run it on a schedule or on request.

on:
  workflow_dispatch:
    inputs:
      selftest:
        description: Run the built-in speech test instead of real jobs
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: lyrics-align
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WORKER_URL: https://biksluembwawllqdalct.supabase.co/functions/v1/lyrics-worker
    steps:
      - name: Is anything waiting?
        id: peek
        run: |
          if [ "${{ inputs.selftest }}" = "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sommyart-lyrics-worker" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          OUT=$(curl -sS -m 30 -X POST "$WORKER_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"action":"peek"}')
          echo "peek says: $OUT"
          N=$(echo "$OUT" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("pending",0))')
          if [ "$N" -gt 0 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.peek.outputs.go == 'true'
        with:
          ref: connect-new-supabase

      - uses: actions/setup-python@v5
        if: steps.peek.outputs.go == 'true'
        with:
          python-version: "3.11"

      - name: Install tools
        if: steps.peek.outputs.go == 'true'
        run: |
          pip install torch==2.7.0 torchaudio==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy requests uroman
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng

      - name: Remember the model between runs
        if: steps.peek.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: mms-fa-model-v1

      - name: Test with a synthetic voice
        if: steps.peek.outputs.go == 'true' && inputs.selftest
        run: python tools/lyrics_align/worker.py --selftest

      - name: Time the waiting lyrics
        if: steps.peek.outputs.go == 'true' && !inputs.selftest
        run: python tools/lyrics_align/worker.py
